<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#F3E5F5"/>
  
  <!-- Gears interconnected -->
  <g opacity="0.9">
    <!-- Large gear -->
    <circle cx="250" cy="200" r="80" fill="none" stroke="#6C63FF" stroke-width="12"/>
    <circle cx="250" cy="200" r="40" fill="none" stroke="#6C63FF" stroke-width="8"/>
    <rect x="235" y="110" width="30" height="40" fill="#6C63FF" rx="8"/>
    <rect x="235" y="250" width="30" height="40" fill="#6C63FF" rx="8"/>
    <rect x="160" y="185" width="40" height="30" fill="#6C63FF" rx="8"/>
    <rect x="300" y="185" width="40" height="30" fill="#6C63FF" rx="8"/>
    <rect x="185" y="135" width="35" height="35" fill="#6C63FF" rx="8" transform="rotate(45 202.5 152.5)"/>
    <rect x="280" y="135" width="35" height="35" fill="#6C63FF" rx="8" transform="rotate(-45 297.5 152.5)"/>
    <rect x="185" y="230" width="35" height="35" fill="#6C63FF" rx="8" transform="rotate(-45 202.5 247.5)"/>
    <rect x="280" y="230" width="35" height="35" fill="#6C63FF" rx="8" transform="rotate(45 297.5 247.5)"/>
    
    <!-- Medium gear -->
    <circle cx="420" cy="180" r="60" fill="none" stroke="#FF6B9D" stroke-width="10"/>
    <circle cx="420" cy="180" r="30" fill="none" stroke="#FF6B9D" stroke-width="6"/>
    <rect x="408" y="110" width="24" height="30" fill="#FF6B9D" rx="6"/>
    <rect x="408" y="210" width="24" height="30" fill="#FF6B9D" rx="6"/>
    <rect x="360" y="168" width="30" height="24" fill="#FF6B9D" rx="6"/>
    <rect x="450" y="168" width="30" height="24" fill="#FF6B9D" rx="6"/>
    
    <!-- Small gear -->
    <circle cx="160" cy="280" r="45" fill="none" stroke="#4CAF50" stroke-width="8"/>
    <circle cx="160" cy="280" r="22" fill="none" stroke="#4CAF50" stroke-width="5"/>
    <rect x="150" y="230" width="20" height="25" fill="#4CAF50" rx="5"/>
    <rect x="150" y="300" width="20" height="25" fill="#4CAF50" rx="5"/>
    <rect x="125" y="270" width="25" height="20" fill="#4CAF50" rx="5"/>
    <rect x="190" y="270" width="25" height="20" fill="#4CAF50" rx="5"/>
  </g>
  
  <!-- Connection lines -->
  <path d="M 330 200 L 360 180" stroke="#FFD54F" stroke-width="4" stroke-dasharray="8,4"/>
  <path d="M 200 260 L 160 280" stroke="#FFD54F" stroke-width="4" stroke-dasharray="8,4"/>
  
  <!-- Wrench icon -->
  <path d="M 500 320 L 520 300 L 530 310 L 510 330 Z" fill="#9E9E9E"/>
  <rect x="495" y="325" width="8" height="40" fill="#9E9E9E" rx="4" transform="rotate(-45 499 345)"/>
  
  <!-- Efficiency arrows -->
  <path d="M 50 100 L 90 100 L 80 90 M 90 100 L 80 110" stroke="#FF6B35" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 550 300 L 590 300 L 580 290 M 590 300 L 580 310" stroke="#4CAF50" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
