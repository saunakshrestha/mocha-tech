<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#E8F5E9"/>
  
  <!-- Document/spreadsheet -->
  <rect x="100" y="80" width="400" height="280" fill="white" stroke="#BDBDBD" stroke-width="3" rx="8"/>
  
  <!-- Table rows -->
  <line x1="120" y1="120" x2="480" y2="120" stroke="#E0E0E0" stroke-width="2"/>
  <line x1="120" y1="160" x2="480" y2="160" stroke="#E0E0E0" stroke-width="2"/>
  <line x1="120" y1="200" x2="480" y2="200" stroke="#E0E0E0" stroke-width="2"/>
  <line x1="120" y1="240" x2="480" y2="240" stroke="#E0E0E0" stroke-width="2"/>
  <line x1="120" y1="280" x2="480" y2="280" stroke="#E0E0E0" stroke-width="2"/>
  <line x1="120" y1="320" x2="480" y2="320" stroke="#E0E0E0" stroke-width="2"/>
  
  <!-- Columns -->
  <line x1="220" y1="100" x2="220" y2="340" stroke="#E0E0E0" stroke-width="2"/>
  <line x1="350" y1="100" x2="350" y2="340" stroke="#E0E0E0" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="120" y="100" width="360" height="20" fill="#6C63FF" opacity="0.2"/>
  
  <!-- Checkmarks -->
  <path d="M 140 145 L 150 155 L 165 130" stroke="#4CAF50" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 140 185 L 150 195 L 165 170" stroke="#4CAF50" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 140 225 L 150 235 L 165 210" stroke="#4CAF50" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Text lines -->
  <rect x="240" y="135" width="90" height="8" fill="#9E9E9E" rx="4"/>
  <rect x="240" y="175" width="80" height="8" fill="#9E9E9E" rx="4"/>
  <rect x="240" y="215" width="95" height="8" fill="#9E9E9E" rx="4"/>
  <rect x="240" y="255" width="70" height="8" fill="#9E9E9E" rx="4"/>
  <rect x="240" y="295" width="85" height="8" fill="#9E9E9E" rx="4"/>
  
  <!-- Data/numbers -->
  <rect x="370" y="135" width="50" height="8" fill="#2E5C7F" rx="4"/>
  <rect x="370" y="175" width="50" height="8" fill="#2E5C7F" rx="4"/>
  <rect x="370" y="215" width="50" height="8" fill="#2E5C7F" rx="4"/>
  
  <!-- Clipboard icon -->
  <rect x="30" y="100" width="50" height="70" fill="white" stroke="#757575" stroke-width="2" rx="4"/>
  <rect x="45" y="95" width="20" height="10" fill="#9E9E9E" rx="2"/>
  <line x1="40" y1="120" x2="70" y2="120" stroke="#BDBDBD" stroke-width="2"/>
  <line x1="40" y1="135" x2="65" y2="135" stroke="#BDBDBD" stroke-width="2"/>
  <line x1="40" y1="150" x2="70" y2="150" stroke="#BDBDBD" stroke-width="2"/>
</svg>
