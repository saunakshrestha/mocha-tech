<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" fill="none">
  <!-- Background -->
  <rect width="800" height="500" fill="#E3F2FD"/>
  
  <!-- Electrical panel -->
  <rect x="150" y="100" width="500" height="300" fill="#37474F" stroke="#263238" stroke-width="4" rx="8"/>
  
  <!-- Panel sections -->
  <rect x="170" y="120" width="220" height="120" fill="#455A64" rx="4"/>
  <rect x="410" y="120" width="220" height="120" fill="#455A64" rx="4"/>
  <rect x="170" y="260" width="220" height="120" fill="#455A64" rx="4"/>
  <rect x="410" y="260" width="220" height="120" fill="#455A64" rx="4"/>
  
  <!-- Circuit breakers -->
  <rect x="190" y="140" width="30" height="60" fill="#2196F3" rx="4"/>
  <rect x="230" y="140" width="30" height="60" fill="#4CAF50" rx="4"/>
  <rect x="270" y="140" width="30" height="60" fill="#2196F3" rx="4"/>
  <rect x="310" y="140" width="30" height="60" fill="#FF9800" rx="4"/>
  <rect x="350" y="140" width="30" height="60" fill="#2196F3" rx="4"/>
  
  <rect x="430" y="140" width="30" height="60" fill="#4CAF50" rx="4"/>
  <rect x="470" y="140" width="30" height="60" fill="#2196F3" rx="4"/>
  <rect x="510" y="140" width="30" height="60" fill="#FF9800" rx="4"/>
  <rect x="550" y="140" width="30" height="60" fill="#2196F3" rx="4"/>
  <rect x="590" y="140" width="30" height="60" fill="#4CAF50" rx="4"/>
  
  <!-- Meters/Displays -->
  <circle cx="280" cy="320" r="45" fill="#212121"/>
  <circle cx="280" cy="320" r="38" fill="#1B5E20"/>
  <text x="280" y="330" text-anchor="middle" fill="#4CAF50" font-size="24" font-weight="bold">480V</text>
  
  <circle cx="520" cy="320" r="45" fill="#212121"/>
  <circle cx="520" cy="320" r="38" fill="#1A237E"/>
  <text x="520" y="330" text-anchor="middle" fill="#2196F3" font-size="20" font-weight="bold">60Hz</text>
  
  <!-- Warning lights -->
  <circle cx="200" cy="290" r="12" fill="#4CAF50" opacity="0.8"/>
  <circle cx="360" cy="290" r="12" fill="#4CAF50" opacity="0.8"/>
  <circle cx="440" cy="290" r="12" fill="#FFD54F" opacity="0.8"/>
  <circle cx="600" cy="290" r="12" fill="#4CAF50" opacity="0.8"/>
  
  <!-- Wires/connections -->
  <path d="M 100 200 Q 130 200 150 220" stroke="#FF6B35" stroke-width="4" fill="none"/>
  <path d="M 650 200 Q 680 200 700 220" stroke="#2196F3" stroke-width="4" fill="none"/>
  <path d="M 100 300 Q 130 300 150 320" stroke="#FFD54F" stroke-width="4" fill="none"/>
  
  <!-- Cable trays -->
  <rect x="50" y="180" width="100" height="15" fill="#616161" rx="4"/>
  <rect x="50" y="280" width="100" height="15" fill="#616161" rx="4"/>
  <rect x="650" y="180" width="100" height="15" fill="#616161" rx="4"/>
  
  <!-- Labels -->
  <rect x="180" y="210" width="60" height="20" fill="white" rx="2"/>
  <rect x="420" y="210" width="60" height="20" fill="white" rx="2"/>
</svg>
