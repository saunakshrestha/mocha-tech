<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <!-- Industrial background -->
  <rect width="600" height="400" fill="#F5F5F5"/>
  <rect y="300" width="600" height="100" fill="#E0E0E0"/>
  
  <!-- Building/structure -->
  <rect x="80" y="120" width="200" height="180" fill="#5A9FD4" opacity="0.3"/>
  <rect x="90" y="130" width="180" height="160" fill="#2E5C7F"/>
  
  <!-- Windows -->
  <rect x="110" y="150" width="30" height="35" fill="#81D4FA"/>
  <rect x="150" y="150" width="30" height="35" fill="#81D4FA"/>
  <rect x="190" y="150" width="30" height="35" fill="#81D4FA"/>
  <rect x="110" y="200" width="30" height="35" fill="#81D4FA"/>
  <rect x="150" y="200" width="30" height="35" fill="#81D4FA"/>
  <rect x="190" y="200" width="30" height="35" fill="#81D4FA"/>
  <rect x="110" y="250" width="30" height="35" fill="#81D4FA"/>
  <rect x="150" y="250" width="30" height="35" fill="#81D4FA"/>
  <rect x="190" y="250" width="30" height="35" fill="#81D4FA"/>
  
  <!-- Crane/equipment -->
  <rect x="320" y="200" width="15" height="100" fill="#FF6B35"/>
  <rect x="315" y="190" width="25" height="15" fill="#FF8A5C"/>
  <path d="M 335 200 L 450 200" stroke="#FFD54F" stroke-width="4"/>
  <rect x="440" y="200" width="20" height="40" fill="#FFA726"/>
  
  <!-- Pipeline/conduit -->
  <rect x="100" y="320" width="400" height="20" fill="#757575" rx="10"/>
  <circle cx="150" cy="330" r="8" fill="#424242"/>
  <circle cx="250" cy="330" r="8" fill="#424242"/>
  <circle cx="350" cy="330" r="8" fill="#424242"/>
  <circle cx="450" cy="330" r="8" fill="#424242"/>
  
  <!-- Decorative elements -->
  <circle cx="500" cy="100" r="40" fill="#FFD54F" opacity="0.3"/>
  <circle cx="520" cy="130" r="25" fill="#FFA726" opacity="0.3"/>
</svg>
