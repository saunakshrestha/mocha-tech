<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <!-- Laptop base -->
  <rect x="200" y="350" width="400" height="20" fill="#424242" rx="4"/>
  <path d="M 150 370 L 650 370 L 600 400 L 200 400 Z" fill="#757575"/>
  
  <!-- Laptop screen -->
  <rect x="220" y="150" width="360" height="200" fill="#263238" rx="8"/>
  <rect x="235" y="165" width="330" height="170" fill="#37474F"/>
  
  <!-- Screen content - code/diagrams -->
  <g opacity="0.9">
    <line x1="250" y1="185" x2="350" y2="185" stroke="#4CAF50" stroke-width="2"/>
    <line x1="250" y1="200" x2="320" y2="200" stroke="#81C784" stroke-width="2"/>
    <line x1="260" y1="215" x2="340" y2="215" stroke="#81C784" stroke-width="2"/>
    <line x1="250" y1="230" x2="380" y2="230" stroke="#4CAF50" stroke-width="2"/>
    
    <rect x="400" y="185" width="140" height="110" fill="none" stroke="#5A9FD4" stroke-width="1.5"/>
    <circle cx="470" cy="240" r="25" fill="none" stroke="#5A9FD4" stroke-width="1.5"/>
    <line x1="410" y1="195" x2="530" y2="195" stroke="#5A9FD4" stroke-width="1"/>
    <line x1="410" y1="270" x2="470" y2="270" stroke="#5A9FD4" stroke-width="1"/>
  </g>
  
  <!-- Person 1 (left) -->
  <circle cx="180" cy="280" r="35" fill="#FFB6B6"/>
  <path d="M 150 315 L 180 380 L 210 315 Z" fill="#6C63FF"/>
  <path d="M 180 380 L 165 460 M 180 380 L 195 460" stroke="#2E5C7F" stroke-width="8" stroke-linecap="round"/>
  <path d="M 150 325 L 120 370 M 210 325 L 150 360" stroke="#FFB6B6" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Person 2 (center-right) -->
  <circle cx="500" cy="300" r="38" fill="#FFB6B6"/>
  <path d="M 468 338 L 500 410 L 532 338 Z" fill="#FF6B9D"/>
  <path d="M 500 410 L 483 490 M 500 410 L 517 490" stroke="#2E5C7F" stroke-width="8" stroke-linecap="round"/>
  <path d="M 468 348 L 430 390 M 532 348 L 565 380" stroke="#FFB6B6" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Person 3 (right) -->
  <circle cx="650" cy="290" r="32" fill="#FFB6B6"/>
  <path d="M 622 322 L 650 385 L 678 322 Z" fill="#4CAF50"/>
  <path d="M 650 385 L 635 460 M 650 385 L 665 460" stroke="#2E5C7F" stroke-width="7" stroke-linecap="round"/>
  <path d="M 622 332 L 595 370 M 678 332 L 620 355" stroke="#FFB6B6" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Connection lines between people -->
  <path d="M 210 340 Q 350 320 468 340" stroke="#FFD54F" stroke-width="3" stroke-dasharray="8,4" opacity="0.7"/>
  <path d="M 532 350 Q 580 340 622 330" stroke="#FFD54F" stroke-width="3" stroke-dasharray="8,4" opacity="0.7"/>
  
  <!-- Floating icons/elements -->
  <g opacity="0.8">
    <!-- Gears -->
    <circle cx="100" cy="200" r="25" fill="none" stroke="#6C63FF" stroke-width="3"/>
    <circle cx="100" cy="200" r="15" fill="none" stroke="#6C63FF" stroke-width="2"/>
    <rect x="95" y="170" width="10" height="15" fill="#6C63FF" rx="2"/>
    <rect x="95" y="215" width="10" height="15" fill="#6C63FF" rx="2"/>
    <rect x="70" y="195" width="15" height="10" fill="#6C63FF" rx="2"/>
    <rect x="115" y="195" width="15" height="10" fill="#6C63FF" rx="2"/>
    
    <!-- Documents -->
    <rect x="700" cy="180" width="60" height="80" fill="white" stroke="#5A9FD4" stroke-width="2" rx="4"/>
    <line x1="710" y1="195" x2="750" y2="195" stroke="#5A9FD4" stroke-width="2"/>
    <line x1="710" y1="210" x2="745" y2="210" stroke="#5A9FD4" stroke-width="2"/>
    <line x1="710" y1="225" x2="740" y2="225" stroke="#5A9FD4" stroke-width="2"/>
    
    <!-- Light bulb -->
    <circle cx="720" cy="100" r="20" fill="#FFD54F" opacity="0.7"/>
    <rect x="715" y="120" width="10" height="15" fill="#757575" rx="2"/>
    <line x1="705" y1="90" x2="695" y2="80" stroke="#FFD54F" stroke-width="2"/>
    <line x1="735" y1="90" x2="745" y2="80" stroke="#FFD54F" stroke-width="2"/>
    <line x1="720" y1="75" x2="720" y2="65" stroke="#FFD54F" stroke-width="2"/>
  </g>
  
  <!-- Circular decorative elements -->
  <circle cx="80" cy="450" r="6" fill="#6C63FF" opacity="0.5"/>
  <circle cx="750" cy="420" r="8" fill="#FF6B9D" opacity="0.5"/>
  <circle cx="120" cy="500" r="5" fill="#4CAF50" opacity="0.5"/>
</svg>
