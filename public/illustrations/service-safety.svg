<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#FFF3E0"/>
  
  <!-- Safety helmet -->
  <ellipse cx="300" cy="180" rx="80" ry="40" fill="#FFD54F"/>
  <path d="M 220 180 Q 300 120 380 180" fill="#FFA726"/>
  <rect x="285" y="140" width="30" height="15" fill="#FF6B35"/>
  
  <!-- Shield with check -->
  <circle cx="300" cy="260" r="60" fill="#4CAF50" opacity="0.2"/>
  <circle cx="300" cy="260" r="50" fill="#4CAF50"/>
  <path d="M 275 260 L 290 275 L 325 235" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Warning signs -->
  <polygon points="120,120 90,170 150,170" fill="#FF9800"/>
  <path d="M 120 140 L 120 155 M 120 163 L 120 168" stroke="white" stroke-width="4" stroke-linecap="round"/>
  
  <polygon points="480,140 450,190 510,190" fill="#FF5722"/>
  <circle cx="480" cy="165" r="3" fill="white"/>
  <line x1="480" y1="155" x2="480" y2="162" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Barriers -->
  <rect x="50" y="320" width="500" height="15" fill="#757575"/>
  <rect x="50" y="320" width="80" height="15" fill="#FFD54F"/>
  <rect x="150" y="320" width="80" height="15" fill="#212121"/>
  <rect x="250" y="320" width="80" height="15" fill="#FFD54F"/>
  <rect x="350" y="320" width="80" height="15" fill="#212121"/>
  <rect x="450" y="320" width="100" height="15" fill="#FFD54F"/>
</svg>
