<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" fill="none">
  <!-- Background -->
  <rect width="600" height="400" fill="#FAFAFA"/>
  
  <!-- Computer monitor -->
  <rect x="150" y="100" width="300" height="200" fill="#263238" rx="8"/>
  <rect x="165" y="115" width="270" height="160" fill="#37474F"/>
  
  <!-- CAD drawing on screen -->
  <g stroke="#4CAF50" stroke-width="2" fill="none">
    <rect x="185" y="135" width="100" height="80"/>
    <rect x="200" y="150" width="30" height="25"/>
    <rect x="240" y="150" width="30" height="25"/>
    <line x1="185" y1="180" x2="285" y2="180"/>
    <circle cx="230" cy="200" r="10"/>
  </g>
  
  <!-- Dimension lines -->
  <line x1="185" y1="225" x2="285" y2="225" stroke="#FFD54F" stroke-width="1.5"/>
  <line x1="185" y1="220" x2="185" y2="230" stroke="#FFD54F" stroke-width="1.5"/>
  <line x1="285" y1="220" x2="285" y2="230" stroke="#FFD54F" stroke-width="1.5"/>
  
  <!-- Blueprint section -->
  <rect x="300" y="135" width="110" height="120" fill="#1A237E" opacity="0.1"/>
  <line x1="310" y1="145" x2="400" y2="145" stroke="#5A9FD4" stroke-width="1"/>
  <line x1="310" y1="160" x2="380" y2="160" stroke="#5A9FD4" stroke-width="1"/>
  <rect x="315" y="175" width="70" height="50" fill="none" stroke="#5A9FD4" stroke-width="1.5"/>
  <circle cx="350" cy="230" r="15" fill="none" stroke="#5A9FD4" stroke-width="1.5"/>
  
  <!-- Monitor stand -->
  <rect x="240" y="300" width="120" height="10" fill="#616161"/>
  <rect x="270" y="310" width="60" height="40" fill="#757575"/>
  <rect x="200" y="350" width="200" height="6" fill="#9E9E9E"/>
  
  <!-- Tools on desk -->
  <circle cx="120" cy="340" r="15" fill="#FF6B35"/>
  <rect x="110" y="335" width="20" height="3" fill="white"/>
  <rect x="118" y="327" width="3" height="20" fill="white"/>
  
  <rect x="480" y="330" width="40" height="8" fill="#2E5C7F"/>
  <polygon points="480,330 475,338 485,338" fill="#FFB6B6"/>
</svg>
