[build]
  command = "rm -rf .next .netlify && pnpm install && pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect www to non-www
[[redirects]]
  from = "https://www.mochatech.com.au/*"
  to = "https://mochatech.com.au/:splat"
  status = 301
  force = true

# Redirect http to https
[[redirects]]
  from = "http://mochatech.com.au/*"
  to = "https://mochatech.com.au/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=3600"
